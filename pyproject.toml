[project]
name = "powertrace-hooks"
version = "0.1.2"
description = "Improved rich tracebacks in every Python process"
authors = [{name = "Quinten Roets", email = "qdr2104@columbia.edu"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "powertrace >=0.2.1, <1",
]

[project.optional-dependencies]
dev = [
    "package-dev-tools >=0.8.1, <1",
    "package-dev-utils >=0.1.6, <1",
]

[project.urls]
"Source Code" = "https://github.com/quintenroets/powertrace-hooks"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
command_line = "-m pytest tests"
relative_files = true

[tool.coverage.report]
precision = 4
fail_under = 100

[tool.mypy]
strict = true
no_implicit_reexport = false

[tool.pytest.ini_options]
pythonpath = [
    "src", ".",
]

[tool.setuptools]
py-modules = [
    "sitecustomize"
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",   # annotated with Any
    "CPY001",   # missing copyright notice
    "D1",       # missing docstrings
    "D200",     # one-line docstring
    "D203",     # conflicts with D211
    "D205",     # blank line between summary and description
    "D212",     # conflicts with D213
    "D401",     # imperative first line
    "G004",     # logging f-string
    "S101",     # assert used
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
